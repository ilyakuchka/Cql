name: Release build

# Только ручной запуск (Actions → Release build → Run workflow).
# Собирает release-APK и публикует его в Releases с автоматическим тегом.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      # Необязательно: если в секретах репозитория заданы ключи, release подписывается ими.
      # Секреты: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Prepare release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Release будет подписан ключом из секретов"
          else
            echo "::notice::Секретов подписи нет: release подписан общим постоянным ключом app/release.keystore (обновления ставятся поверх)"
          fi

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify release has no debug tools
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p "$RUNNER_TEMP/apk"
          unzip -q -o "$apk" -d "$RUNNER_TEMP/apk"
          if grep -rqa -e "SenkuroDebug" -e "__senkuroCapture" "$RUNNER_TEMP/apk"; then
            echo "::error::В release-APK найден отладочный код перехвата запросов"
            exit 1
          fi
          echo "OK: отладочных инструментов в release-APK нет"

      # Версия берётся из app/build.gradle.kts; тег уникален за счёт номера запуска.
      - name: Prepare release info
        id: info
        run: |
          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          APK="me.senkuro.unofficial-${VERSION}.apk"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.info.outputs.tag }}" "${{ steps.info.outputs.apk }}" \
            --target "$GITHUB_SHA" \
            --title "Senkuro Unofficial ${{ steps.info.outputs.version }} (сборка ${{ github.run_number }})" \
            --notes "Новая версия приложения ${{ steps.info.outputs.version }}. Внесены некоторые изменения."

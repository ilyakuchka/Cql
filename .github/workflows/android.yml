name: Android build

# Только ручной запуск (Actions → Android build → Run workflow)
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки (debug — с отладочными инструментами, release — без них)"
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      # Необязательно: если в секретах репозитория заданы ключи, release подписывается ими.
      # Секреты: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Prepare release signing
        if: inputs.build_type == 'release'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Release будет подписан ключом из секретов"
          else
            echo "::notice::Секретов подписи нет: release подписан общим постоянным ключом app/release.keystore (обновления ставятся поверх)"
          fi

      - name: Build APK
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify release has no debug tools
        if: inputs.build_type == 'release'
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p "$RUNNER_TEMP/apk"
          unzip -q -o "$apk" -d "$RUNNER_TEMP/apk"
          if grep -rqa -e "SenkuroDebug" -e "__senkuroCapture" "$RUNNER_TEMP/apk"; then
            echo "::error::В release-APK найден отладочный код перехвата запросов"
            exit 1
          fi
          echo "OK: отладочных инструментов в release-APK нет"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: me.senkuro.unofficial-${{ inputs.build_type }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

name: Debug build

# Только ручной запуск (Actions → Debug build → Run workflow). Собирает только debug-APK.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_TYPE: debug
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: me.senkuro.unofficial-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

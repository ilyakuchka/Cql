query fetchConversations($after: String, $unread: Boolean, $search: String) {
  conversations(first: 20, after: $after, unread: $unread, search: $search) {
    edges {
      node {
        id
        slug
        name
        type
        avatar { original { url } }
        participantUser { id name avatar { original { url } } frame { original { url } } }
        lastMessage {
          id
          createdAt
          content {
      __typename
      ... on TiptapNodeNestedBlock {
        content {
          __typename
          ... on TiptapNodeText { text }
        }
      }
    }
          user { name }
        }
        viewerParticipant { unreadCount }
      }
    }
    pageInfo { hasNextPage endCursor }
  }
}

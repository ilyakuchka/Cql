query fetchMangas(
  $first: Int = 20,
  $after: String,
  $search: String,
  $type: MangaTypeFilter,
  $format: MangaFormatFilter,
  $status: MangaStatusFilter,
  $source: MangaSourceFilter,
  $rating: MangaRatingFilter,
  $chapters: MangaChaptersFilter,
  $originCountry: MangaOriginCountryFilter,
  $releasedOn: MangaReleasedOnFilter,
  $label: MangaLabelFilter,
  $bookmarkCollections: MangaBookmarkCollectionsFilter,
  $translitionStatus: MangaTranslitionStatusFilter,
  $orderField: MangaOrderField = CREATED_AT,
  $orderDirection: OrderDirection = DESC
) {
  mangas(
    first: $first,
    after: $after,
    orderBy: {field: $orderField, direction: $orderDirection},
    search: $search,
    type: $type,
    format: $format,
    status: $status,
    source: $source,
    rating: $rating,
    chapters: $chapters,
    originCountry: $originCountry,
    releasedOn: $releasedOn,
    label: $label,
    bookmarkCollections: $bookmarkCollections,
    translitionStatus: $translitionStatus
  ) {
    edges { node { id slug originalName { lang content } titles { lang content } status rating cover { original { url } } } }
    pageInfo { hasNextPage endCursor }
  }
}

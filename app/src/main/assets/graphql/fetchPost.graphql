query fetchPost($slug: String!) {
  post(slug: $slug) {
    id slug title views comments createdAt
    author { id name avatar { original { url } } frame { original { url } } }
    team { id slug name }
    content {
      __typename
      ... on TiptapNodeNestedBlock { content { __typename ... on TiptapNodeText { text } } }
      ... on TiptapNodeHeading { content { __typename ... on TiptapNodeText { text } } }
    }
  }
}

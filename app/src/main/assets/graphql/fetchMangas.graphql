query fetchMangas($first: Int = 20, $after: String, $character: MangaCharacterFilter) {
  mangas(first: $first, after: $after, character: $character, orderBy: {field: CREATED_AT, direction: DESC}) {
    edges { node { id slug originalName { lang content } titles { lang content } status rating cover { original { url } } } }
    pageInfo { hasNextPage endCursor }
  }
}
